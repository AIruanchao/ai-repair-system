name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi uvicorn pydantic pytest pytest-cov
      - run: pytest --cov=. --cov-report=term-missing --tb=short
        env:
          NEWAPI_KEY: dummy
